
on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ghcr.io/${{ steps.string.outputs.owner_lc }}/terminalgenerator:${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set owner to lowercase
        id: string
        run: echo "owner_lc=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend 
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./landing-page/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.owner_lc }}/terminalgenerator:${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ steps.string.outputs.owner_lc }}/terminalgenerator:latest
